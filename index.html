<style>
  :root{
    --primary:#fe2c55; --primary-dark:#d81e42; --ink:#161823; --sub:#6b7280;
    --bg:#f5f6f8; --card:#ffffff; --line:#e8eaef; --green:#07c160; --red:#f43f5e;
    --amber:#f59e0b; --blue:#3b82f6; --purple:#8b5cf6;
    --radius:14px; --shadow:0 2px 10px rgba(22,24,35,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 96px}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:34px;height:34px}
  .brand h1{font-size:19px;font-weight:700}
  .brand .sub{font-size:12px;color:var(--sub)}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .sync-badge.fail .sync-dot{background:var(--red)}
  .sync-badge.fail{color:var(--red);border-color:#fecdd3}
  .demo-switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .demo-switch .sw{width:32px;height:18px;border-radius:999px;background:#d1d5db;position:relative;transition:.15s;flex:none}
  .demo-switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
  .demo-switch.on .sw{background:var(--amber)}
  .demo-switch.on .sw::after{left:16px}
  /* 主操作区 */
  .hero{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;text-decoration:none}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .btn-primary:hover{background:var(--primary-dark);color:#fff}
  .btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .btn-dark:hover{background:#000;color:#fff}
  .btn-danger:hover{border-color:var(--red);color:var(--red)}
  .btn-sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
  .hero .btn{min-height:50px;font-size:15px;padding:0 22px}
  details.more{margin-bottom:16px}
  details.more summary{cursor:pointer;font-size:13px;color:var(--sub);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
  details.more summary::before{content:"▸";font-size:11px}
  details.more[open] summary::before{content:"▾"}
  .more-body{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
  /* 今天要处理 */
  .today-box{background:linear-gradient(135deg,#fff 0%,#fff5f6 100%);border:1px solid #ffd9de;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .today-box h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .today-box h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .today-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
  .today-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .tag{flex:none;font-size:12px;border-radius:6px;padding:2px 8px;font-weight:600}
  .tag-overdue{background:#ffe4e6;color:var(--red)}
  .tag-new{background:#e0f2fe;color:#0369a1}
  .tag-review{background:#fef3c7;color:#b45309}
  .today-empty{color:var(--sub);font-size:13px;padding:6px 2px}
  /* Tab */
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px;overflow-x:auto}
  .tab{flex:1;min-width:88px;text-align:center;padding:10px 8px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--sub);white-space:nowrap;border:none;background:transparent;font-family:inherit;min-height:44px}
  .tab.active{background:var(--ink);color:#fff;font-weight:600}
  .tab .cnt{display:inline-block;margin-left:4px;font-size:12px;background:rgba(254,44,85,.14);color:var(--primary);border-radius:999px;padding:0 7px}
  .tab.active .cnt{background:rgba(255,255,255,.22);color:#fff}
  /* 搜索排序条 */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filterbar input,.filterbar select{min-height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
  .filterbar input{flex:1;min-width:160px}
  .filterbar input:focus,.filterbar select:focus{outline:none;border-color:var(--primary)}
  /* 卡片 */
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .vcard.expired{opacity:.78;border-style:dashed}
  .vcard.sample{background:#fffdf5;border-color:#fde68a}
  .vcard .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .vcard .title{font-size:16px;font-weight:700;flex:1;min-width:0}
  .vcard .title a{color:var(--ink);text-decoration:none}
  .vcard .title a:hover{color:var(--primary)}
  .vcard .title .nolink{color:var(--sub)}
  .score-pill{flex:none;text-align:center;background:var(--ink);color:#fff;border-radius:10px;padding:6px 10px;min-width:64px}
  .score-pill b{font-size:19px;display:block;line-height:1.1}
  .score-pill span{font-size:11px;opacity:.75}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;font-size:13px;color:var(--sub)}
  .meta b{color:var(--ink);font-weight:600}
  .meta .missing{color:var(--amber)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{font-size:12px;border-radius:6px;padding:3px 9px;background:#f1f2f6;color:var(--sub)}
  .chip.type{background:#ede9fe;color:var(--purple)}
  .chip.topic{background:#e0f2fe;color:#0369a1}
  .chip.pass{background:#dcfce7;color:#15803d}
  .chip.fail{background:#ffe4e6;color:var(--red)}
  .chip.warn{background:#fef3c7;color:#b45309}
  .chip.exp{background:#161823;color:#fff}
  .chip.sample-chip{background:#fef3c7;color:#92400e}
  .chip.override{background:#ede9fe;color:#6d28d9}
  .chip.real{background:#dcfce7;color:#15803d}
  .reason{font-size:13px;color:var(--sub);background:#fafafa;border-left:3px solid var(--line);padding:8px 10px;border-radius:0 8px 8px 0;margin:8px 0}
  .reason b{color:var(--ink)}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .note-input{width:100%;min-height:38px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-family:inherit;resize:vertical;background:#fff;color:var(--ink)}
  .note-input:focus{outline:none;border-color:var(--primary)}
  .updated{font-size:12px;color:#9ca3af;margin-top:8px}
  .empty-state{text-align:center;color:var(--sub);padding:44px 16px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);font-size:14px}
  /* 面板 */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .panel h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .panel h3 svg{width:18px;height:18px;flex:none}
  .panel p.tip{font-size:13px;color:var(--sub);margin-bottom:10px}
  .kw-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .kw-row input{flex:1;min-width:200px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
  .kw-row input:focus{outline:none;border-color:var(--primary)}
  .task-card{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px;margin-top:12px;display:none}
  .task-card.show{display:block}
  .task-card h4{font-size:14px;color:#92400e;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .task-card pre{background:#fff;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow-y:auto;font-family:ui-monospace,Consolas,monospace;color:#451a03}
  textarea.box{width:100%;min-height:130px;font-size:14px;font-family:ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);resize:vertical}
  textarea.box:focus{outline:none;border-color:var(--primary)}
  .log-box{background:var(--ink);color:#d1d5db;font-family:ui-monospace,Consolas,monospace;font-size:12px;border-radius:10px;padding:12px;max-height:220px;overflow-y:auto;margin-top:10px;white-space:pre-wrap;word-break:break-all}
  .log-box .err{color:#fca5a5}.log-box .ok{color:#86efac}.log-box .warn{color:#fcd34d}
  .criteria-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
  .criteria-grid .c{background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--sub)}
  .criteria-grid .c b{display:block;color:var(--ink);font-size:13px}
  /* 拆解区 */
  .ana-block{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .ana-row{display:flex;gap:10px;font-size:13.5px;padding:5px 0}
  .ana-row .k{flex:none;width:88px;color:var(--sub);font-size:13px}
  .ana-row .v{flex:1}
  .ana-row .v ul{margin:0;padding-left:18px}
  .vp-author{color:#0369a1}
  .vp-unverified{color:#b45309}
  .score-bar{height:8px;background:#f1f2f6;border-radius:999px;overflow:hidden;margin-top:4px}
  .score-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),#ff7a59)}
  .no-transcript{background:#f8f9fb;border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--sub);font-size:13px;margin-top:10px}
  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:22px;max-width:560px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2);max-height:88vh;overflow-y:auto}
  .modal h4{font-size:16px;margin-bottom:12px}
  .modal p{font-size:14px;color:var(--sub);margin-bottom:16px}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-grid .full{grid-column:1/-1}
  .form-grid label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
  .form-grid textarea{min-height:90px;resize:vertical}
  .form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{outline:none;border-color:var(--primary)}
  /* toast */
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;border-radius:999px;padding:10px 20px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}
  @media (max-width:767px){
    .wrap{padding:12px 12px calc(80px + env(safe-area-inset-bottom))}
    .brand h1{font-size:17px}
    .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:0;border-left:none;border-right:none;border-bottom:none;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
    .tab{min-width:0;font-size:12px;padding:8px 2px;min-height:48px}
    .vcard .head{flex-direction:column}
    .score-pill{align-self:flex-start;display:flex;gap:6px;align-items:baseline}
    .score-pill b{font-size:16px}
    .form-grid{grid-template-columns:1fr}
    input,textarea,select{font-size:16px !important}
  }
</style>
</head>

var TEACHING_TOPICS = ['AI教程','AI工具实操','AI工作流','提示词与智能体教学'];
var COGNITION_TOPICS = ['AI与普通人','AI未来发展','AI与职业就业','AI概念科普','普通人用AI','AI机会与焦虑'];
var RELATED_TOPICS = TEACHING_TOPICS.concat(COGNITION_TOPICS);

var state = { videos: [], logs: [], tab: 'candidate', demoMode: false, query: '', sort: 'priority' };

function saveData(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state.videos));
    localStorage.setItem(LS_LOG, JSON.stringify(state.logs.slice(-200)));
    localStorage.setItem(LS_DEMO, state.demoMode ? '1' : '0');
    setSync(true);
    return true;
  }catch(e){
    setSync(false, e && e.message ? e.message : '存储空间不足');

function setSync(ok, msg){
  var badge = document.getElementById('syncBadge');

  if(ok){
    badge.classList.remove('fail');
    txt.textContent = '已保存到本浏览器 ' + nowStr().slice(11);
  }else{
    badge.classList.add('fail');
    txt.textContent = '保存失败：' + (msg || '未知原因');
    toast('保存失败：' + (msg || '未知原因') + '，请立即导出备份', true);
  }
}
function nowStr(){
  var d = new Date();
  function p(n){ return n<10?'0'+n:''+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());

function addLog(msg, level){
  state.logs.push({ t: nowStr(), msg: msg, level: level||'info' });

  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);

/* =========================================================

 * ========================================================= */
/* 把 'YYYY-MM-DD[ HH:mm]' 按北京时间解析为绝对时间；非法返回 null */
function parsePubTime(s){
  if(!s) return null;
  var m = String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{1,2}))?/);
  if(!m) return null;
  var y=+m[1], mo=+m[2], d=+m[3], h=m[4]?+m[4]:0, mi=m[5]?+m[5]:0;
  if(mo<1||mo>12||d<1||d>31||h>23||mi>59) return null;
  var t = Date.UTC(y, mo-1, d, h-8, mi); /* 北京时间 → UTC */
  var chk = new Date(t);
  if(chk.getUTCMonth() !== mo-1) return null;
  return t;
}
/* 小时差：>=0 已发布，<0 未来时间，null 无效 */
function ageHours(v){
  var t = parsePubTime(v.publishTime);
  if(t === null) return null;
  return (Date.now() - t) / 3600000;
}
function isExpired(v){
  var h = ageHours(v);
  return h !== null && h > HARD.hours;
}
function parseWan(v){
  if(v === null || v === undefined || v === '' || v === '未知') return { val:null, approx:false };
  if(typeof v === 'number') return { val:v, approx:false };
  var s = String(v).trim().replace(/,/g,'');
  var m = s.match(/^([\d.]+)\s*万$/);
  if(m) return { val: Math.round(parseFloat(m[1]) * 10000), approx:true };
  var n = parseFloat(s);
  return isNaN(n) ? { val:null, approx:false } : { val:Math.round(n), approx:false };
}
function approxUnit(val){ return val % 10000 === 0 ? 10000 : 1000; }
/* 约数跨越阈值 → 无法确定是否满足优先信号 */
function isAmbiguous(num, approx, threshold){
  if(num === null || !approx) return false;
  var u = approxUnit(num);
  return (num - u) < threshold && threshold < (num + u);
}
function ratioOf(v){
  if(v.fans === null || v.fans <= 0 || v.likes === null) return null;
  return v.likes / v.fans;
}
/* 基础条件核查：verdict = pass | review | fail */
function checkHard(v){
  var fails = [], reviews = [];
  var h = ageHours(v);
  if(h === null) reviews.push(v.publishTime ? '发布时间无效（'+v.publishTime+'）' : '发布时间缺失');
  else if(h < -0.5) reviews.push('发布时间在未来，属无效时间');
  else if(h > HARD.hours) fails.push('发布已超过336小时（约'+Math.floor(h/24)+'天前）');
  if(v.fans === null) reviews.push('粉丝数缺失');
  if(v.likes === null) reviews.push('点赞数缺失');
  if(v.comments === null) reviews.push('评论数缺失');
  var r = ratioOf(v);
  if(r === null && v.fans !== null && v.likes !== null) reviews.push('赞粉比无法计算');
  if(!v.topic) reviews.push('话题未分类');
  else if(RELATED_TOPICS.indexOf(v.topic) < 0) fails.push('话题不属于AI教学类或AI认知类');
  if(!v.contentType) reviews.push('内容类型未确认');
  else if(v.contentType === '剧情') fails.push('剧情/短剧类内容按规则排除');
  var verdict = fails.length ? 'fail' : (reviews.length ? 'review' : 'pass');
  return { verdict:verdict, fails:fails, reviews:reviews };
}
/* 综合优先级分 */
function priorityScore(v){
  var s = 0;
  if(v.contentType === '真人口播') s += 40; else if(v.contentType === '人物加屏幕') s += 15;
  var r = ratioOf(v);
  if(v.fans !== null && v.likes !== null){
    if(v.fans <= HARD.fansMax && v.likes >= HARD.likesMin) s += 30;
    if(r !== null) s += Math.min(20, r * 20);
  }
  if(v.comments !== null) s += Math.min(20, v.comments / 100);
  if(v.analysis){
    if(v.analysis.score) s += v.analysis.score * 0.25;
    if(v.analysis.adaptable === '适合') s += 10; else if(v.analysis.adaptable === '勉强') s += 4;
  }
  var h = ageHours(v);
  if(h !== null && h >= 0) s += Math.max(0, 10 - (h/24) * 1.5);
  return Math.round(s * 10) / 10;
}
function referenceRank(v){
  var score = v.referenceScore;
  if(score === null || score === undefined || score === '') score = v.analysis && v.analysis.score;
  score = Number(score);
  return isNaN(score) ? 0 : score;
}
function topicRank(v){
  if(TEACHING_TOPICS.indexOf(v.topic) >= 0) return 2;
  if(COGNITION_TOPICS.indexOf(v.topic) >= 0) return 1;
  return 0;
}
function contentRank(v){
  if(v.contentType === '真人口播') return 2;
  if(v.contentType === '人物加屏幕') return 1;
  return 0;
}
function lowFansHighLikesRank(v){
  var r = ratioOf(v);
  if(v.fans === null || v.likes === null) return -1;
  var s = 0;
  if(v.fans <= HARD.fansMax) s += 2;
  if(v.likes >= HARD.likesMin) s += 2;
  if(r !== null && r >= HARD.ratioMin) s += 1;
  return s;
}
function fmtNum(n){
  if(n === null || n === undefined) return '未知';
  if(n >= 10000) return (n/10000).toFixed(n % 10000 === 0 ? 0 : 1) + '万';
  return String(n);
}
function fmtRatio(v){
  var r = ratioOf(v);
  return r === null ? '未知' : (r*100).toFixed(1) + '%';
}
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function canonLink(link){
  if(!link) return '';
  var m = String(link).match(/(video|shipin)\/(\d+)/);
  return m ? m[1] + '/' + m[2] : String(link).trim();

function loadData(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    state.videos = raw ? JSON.parse(raw) : null;
    var lraw = localStorage.getItem(LS_LOG);
    state.logs = lraw ? JSON.parse(lraw) : [];
    state.demoMode = localStorage.getItem(LS_DEMO) === '1';
  }catch(e){ state.videos = null; state.logs = []; }
  if(state.videos === null){
    state.videos = seedReal().concat(seedDemo());
    addLog('首次打开：已载入 4 条真实采集记录 + 5 条演示（模拟）记录，演示模式默认关闭','info');
  }
  var existingIds = {};
  state.videos.forEach(function(v){ existingIds[v.id] = true; });
  var missingSeeds = seedReal().filter(function(v){ return !existingIds[v.id]; });
  if(missingSeeds.length){
    state.videos = state.videos.concat(missingSeeds);
    saveData();
  }
}
/* 每次打开/刷新：时效重检。候选/待复核中已过期的自动移出有效候选 */
function recheckFreshness(){
  var moved = 0;
  state.videos.forEach(function(v){
    if(v.isSample) return;
    if((v.status === 'candidate' || v.status === 'review') && isExpired(v) && !v.manualOverride){
      var chk = checkHard(v);
      if(chk.verdict === 'fail'){
        v.status = 'rejected';
        v.reason = '已过期：' + chk.fails.join('；') + '（打开时自动重检）';
        v.updatedAt = nowStr();
        moved++;
      }
    }
  });
  if(moved) addLog('时效重检：' + moved + ' 条记录因超过336小时自动移出有效候选','warn');
}

var $panel = document.getElementById('panel');

function visibleVideos(){
  if(state.demoMode) return state.videos;
  return state.videos.filter(function(v){ return !v.isSample; });
}
function statusVideos(s){
  return visibleVideos().filter(function(v){ return v.status === s; });
}
function applyQuerySort(list){
  var q = state.query.trim().toLowerCase();
  if(q) list = list.filter(function(v){
    return (v.title||'').toLowerCase().indexOf(q) >= 0 || (v.author||'').toLowerCase().indexOf(q) >= 0;
  });
  var sort = state.sort;
  list = list.slice().sort(function(a,b){
    if(sort === 'likes') return (b.likes||-1) - (a.likes||-1);
    if(sort === 'ratio'){ var ra=ratioOf(a), rb=ratioOf(b); return (rb===null?-1:rb) - (ra===null?-1:ra); }
    if(sort === 'time'){ var ta=parsePubTime(a.publishTime)||0, tb=parsePubTime(b.publishTime)||0; return tb - ta; }
    var byReference = referenceRank(b) - referenceRank(a); if(byReference) return byReference;
    var byContent = contentRank(b) - contentRank(a); if(byContent) return byContent;
    var byLowFansHighLikes = lowFansHighLikesRank(b) - lowFansHighLikesRank(a); if(byLowFansHighLikes) return byLowFansHighLikes;
    var byComments = (b.comments===null?-1:b.comments) - (a.comments===null?-1:a.comments); if(byComments) return byComments;
    return priorityScore(b) - priorityScore(a);
  });
  return list;
}

function renderToday(){
  var box = document.getElementById('todayList');
  var items = [];
  visibleVideos().forEach(function(v){
    var h = ageHours(v);
    if(v.status === 'review'){
      items.push({ v:v, tag:'<span class="tag tag-review">待复核</span>', tab:'review' });
    }else if(v.status === 'candidate'){
      if(h !== null && h > HARD.urgentHours) items.push({ v:v, tag:'<span class="tag tag-overdue">临期 · 发布'+Math.floor(h/24)+'天</span>', tab:'candidate' });
      else items.push({ v:v, tag:'<span class="tag tag-new">今日候选</span>', tab:'candidate' });
    }else if(v.status === 'selected' && isExpired(v)){
      items.push({ v:v, tag:'<span class="tag tag-overdue">入选已过期</span>', tab:'selected' });
    }
  });
  if(!items.length){
    box.innerHTML = '<div class="today-empty">今天没有待处理的条目。点「开始搜索」发起一次采集任务吧。</div>';
    return;
  }
  box.innerHTML = items.slice(0,8).map(function(it){

  }).join('');
}

function chipHtml(v, chk){
  var chips = '';
  if(v.isSample) chips += '<span class="chip sample-chip">模拟数据</span>';
  if(v.collectedBy === 'real') chips += '<span class="chip real">真实采集</span>';
  if(v.contentType) chips += '<span class="chip type">'+esc(v.contentType)+'</span>';
  chips += '<span class="chip topic">'+esc(v.topic||'未分类')+'</span>';
  if(TEACHING_TOPICS.indexOf(v.topic) >= 0) chips += '<span class="chip pass">AI教学类 · 主采集</span>';
  else if(COGNITION_TOPICS.indexOf(v.topic) >= 0) chips += '<span class="chip type">AI认知类 · 补充</span>';
  if(v.manualOverride) chips += '<span class="chip override">人工例外</span>';
  if(isExpired(v) && v.status !== 'rejected') chips += '<span class="chip exp">已过期 · 超336小时</span>';
  if(v.manualOverride){
    chips += '<span class="chip warn">未通过基础条件（人工保留）</span>';
  }else if(chk.verdict === 'pass') chips += '<span class="chip pass">✓ 基础条件通过</span>';
  else if(chk.verdict === 'review') chips += '<span class="chip warn">待确认（'+chk.reviews.length+'项）</span>';
  else chips += '<span class="chip fail">✗ 未通过基础条件（'+chk.fails.length+'项）</span>';
  return chips;
}

function metricHtml(label, val){
  if(val === null || val === undefined) return '<span>'+label+' <b class="missing">未获取</b></span>';
  return '<span>'+label+' <b>'+fmtNum(val)+'</b></span>';
}

function cardHtml(v, actions){
  var chk = checkHard(v);
  var ana = v.analysis;
  var score = ana && ana.score ? ana.score : null;
  var linkHtml = v.link && v.link.indexOf('demo://') !== 0
    ? '<a href="'+esc(v.link)+'" target="_blank" rel="noopener">'+esc(v.title)+'</a>'
    : '<span class="nolink">'+esc(v.title)+'（模拟链接）</span>';
  var detail = [];
  if(chk.fails.length) detail.push('<b>未通过基础条件：</b>'+esc(chk.fails.join('；')));
  if(chk.reviews.length) detail.push('<b>待确认：</b>'+esc(chk.reviews.join('；')));
  if(v.manualOverride) detail.push('<b>人工例外理由：</b>'+esc(v.overrideReason||'—'));
  return '<div class="vcard'+(isExpired(v)&&v.status!=='rejected'?' expired':'')+(v.isSample?' sample':'')+'" data-id="'+esc(v.id)+'">'
    + '<div class="head"><div class="title">'+linkHtml+'</div>'
    + (score !== null ? '<div class="score-pill"><b>'+score+'</b><span>可借鉴</span></div>' : '')
    + '</div>'
    + '<div class="meta">'
    + '<span>作者 <b>'+esc(v.author||'未知')+'</b></span>'
    + '<span>发布 '+(v.publishTime?'<b>'+esc(v.publishTime)+'</b>':'<b class="missing">未获取</b>')+'</span>'
    + '<span>时长 '+(v.duration?'<b>'+esc(v.duration)+'</b>':'<b class="missing">未获取</b>')+'</span>'
    + metricHtml('粉丝', v.fans) + metricHtml('点赞', v.likes) + metricHtml('评论', v.comments)
    + metricHtml('收藏', v.favorites) + metricHtml('分享', v.shares)
    + '<span>赞粉比 <b>'+fmtRatio(v)+'</b></span>'
    + '</div>'
    + '<div class="chips">'+chipHtml(v, chk)+'</div>'
    + (detail.length ? '<div class="reason">'+detail.join('<br>')+'</div>' : '')
    + '<div class="reason"><b>'+(v.status==='rejected'?'淘汰原因':v.status==='selected'?'入选说明':'筛选说明')+'：</b>'+esc(v.reason||'—')+'</div>'
    + '<div class="card-actions">'+actions+'</div>'
    + '<textarea class="note-input" data-action="note" placeholder="备注（自动保存）">'+esc(v.note||'')+'</textarea>'
    + '<div class="updated">最后更新：'+esc(v.updatedAt||'—')+'</div>'
    + '</div>';
}

function findV(id){
  for(var i=0;i<state.videos.length;i++) if(state.videos[i].id === id) return state.videos[i];
  return null;
}
function setStatus(id, st, reasonText){
  var v = findV(id); if(!v) return;
  v.status = st; v.updatedAt = nowStr();
  if(reasonText !== undefined) v.reason = reasonText;
  if(st !== 'selected'){ v.manualOverride = false; }
  saveData(); refreshAll();
}
function rawToVideo(raw){
  var fans = parseWan(raw.fans), likes = parseWan(raw.likes), comments = parseWan(raw.comments),
      favs = parseWan(raw.favorites), shares = parseWan(raw.shares);
  return {
    id: 'v' + Date.now() + Math.floor(Math.random()*10000),
    title: raw.title || '', link: raw.link || '', author: raw.author || '未知',
    publishTime: raw.publishTime || null, duration: raw.duration || null,
    fans: fans.val, likes: likes.val, comments: comments.val, favorites: favs.val, shares: shares.val,
    approx: { fans:fans.approx, likes:likes.approx, comments:comments.approx, favorites:favs.approx, shares:shares.approx },
    contentType: raw.contentType || null, topic: raw.topic || null,
    status: 'candidate', manualOverride:false, overrideReason:'', reason: '',
    note: raw.note || '', transcript: raw.transcript || '',
    analysis: raw.analysis || null,
    isSample: false, collectedBy: raw.collectedBy || 'real',
    createdAt: nowStr(), updatedAt: nowStr()
  };
}
function classifyImported(v){
  var chk = checkHard(v);
  if(chk.verdict === 'review'){
    v.status = 'review';
    v.reason = '待复核：' + chk.reviews.join('、') + '，未获取数据不按0处理';
  }else if(chk.verdict === 'fail'){
    v.status = 'rejected';
    v.reason = '淘汰：' + chk.fails.join('；');
  }else{
    var r = ratioOf(v);
    v.status = 'candidate';
    v.reason = '基础条件通过：优先级评分' + priorityScore(v) + '（赞粉比' + (r!==null?(r*100).toFixed(1):'?') + '%）';
  }
}
/* 采集结果导入：同链接 → 更新（保留备注/状态/拆解）；同标题不同链接 → 新记录 */
function importVideos(arr){
  var added = 0, updated = 0, toReview = 0;
  arr.forEach(function(raw){
    if(!raw || !raw.title) return;
    var nv = rawToVideo(raw);
    var exist = null;
    var cl = canonLink(nv.link);
    if(cl) exist = state.videos.filter(function(v){ return canonLink(v.link) === cl; })[0];
    if(!exist && nv.link === ''){
      exist = state.videos.filter(function(v){ return v.title === nv.title && v.author === nv.author; })[0];
    }
    if(exist){
      ['title','author','publishTime','duration','fans','likes','comments','favorites','shares','contentType','topic'].forEach(function(k){
        if(nv[k] !== null && nv[k] !== '' && nv[k] !== undefined) exist[k] = nv[k];
      });
      if(nv.approx) exist.approx = nv.approx;
      if(nv.transcript) exist.transcript = nv.transcript;
      if(nv.analysis) exist.analysis = nv.analysis;
      exist.updatedAt = nowStr();
      if(!exist.manualOverride && exist.status !== 'selected') classifyImported(exist);
      updated++;
    }else{
      classifyImported(nv);
      if(nv.status === 'review') toReview++;
      state.videos.push(nv);
      added++;
    }
  });
  addLog('采集导入完成：新增 '+added+' 条、更新 '+updated+' 条（其中 '+toReview+' 条新增转待复核）', added+updated>0?'ok':'warn');
  saveData(); refreshAll();
  return { added:added, updated:updated, toReview:toReview };
}

/* 备份：完整保留状态/备注/分析/标识/时间 */
function makeBackup(){
  return { app:'douyin-koubo-workbench', version:2, exportedAt: nowStr(), videos: state.videos };
}
function restoreBackup(data){
  var arr = Array.isArray(data) ? data : (data && Array.isArray(data.videos) ? data.videos : null);
  if(!arr) return { ok:false, msg:'文件不是有效备份（缺少 videos 数组）' };
  var added = 0, replaced = 0;
  arr.forEach(function(bv){
    if(!bv || !bv.id) return;
    var idx = -1;
    for(var i=0;i<state.videos.length;i++) if(state.videos[i].id === bv.id){ idx = i; break; }
    if(idx >= 0){ state.videos[idx] = bv; replaced++; }
    else{ state.videos.push(bv); added++; }
  });
  saveData(); refreshAll();
  return { ok:true, added:added, replaced:replaced };
}

function download(name, content, mime){

  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

$panel.addEventListener('click', function(e){

  if(action === 'genTask'){
    state._taskText = buildCollectTask();

    saveData(); refreshAll();
    return;
  }
  if(action === 'copyTask'){
    var txt = document.getElementById('taskText').textContent;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('任务已复制，发给 WorkBuddy 即可'); }, function(){ toast('复制失败，请手动选择文本复制', true); });

    var lnk = btn.dataset.link || '';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lnk).then(function(){ toast('链接已复制，可粘贴到抖音 App 打开'); }, function(){ toast('复制失败，请手动复制：' + lnk, true); });
    }else toast('请手动复制链接：' + lnk, true);
    return;
  }
  if(action === 'importJson'){
    var txt2 = document.getElementById('importBox').value.trim();
    if(!txt2){ addLog('导入失败：内容为空','error'); refreshAll(); return; }
    try{
      var data = JSON.parse(txt2);
      if(!Array.isArray(data)) data = [data];
      var r = importVideos(data);
      toast('新增 '+r.added+' 条，更新 '+r.updated+' 条');

      addLog('导入失败：JSON 格式错误（' + err.message + '）','error');
      toast('JSON 格式错误', true);
      refreshAll();
    }
    return;
  }
  if(action === 'goto'){
    state.tab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x.dataset.tab === state.tab); });
    refreshAll(); return;
  }
  var card = btn.closest('.vcard'); if(!card) return;
  var id = card.dataset.id;
  if(action === 'select'){
    var v0 = findV(id), chk0 = checkHard(v0);
    if(chk0.verdict !== 'pass' && !v0.manualOverride){
      confirmModal('未通过基础条件', '该记录未通过或未确认基础条件，直接入选将标注为「人工例外」。也可以先补全数据。', function(){

      });
      return;
    }
    setStatus(id, 'selected', '人工确认入选：' + (v0.reason||'符合改编方向'));
  }
  else if(action === 'keepOverride'){
    overrideId = id;
    document.getElementById('overrideReason').value = '';
    document.getElementById('overrideMask').classList.add('show');
  }
  else if(action === 'reject'){
    var v = findV(id), chk = checkHard(v);
    setStatus(id, 'rejected', chk.fails.length ? '淘汰：' + chk.fails.join('；') : '人工淘汰');
  }
  else if(action === 'toReview') setStatus(id, 'review');
  else if(action === 'toCandidate') setStatus(id, 'candidate');
  else if(action === 'edit') openEdit(id);
  else if(action === 'updateData'){
    updatingId = id;
    document.getElementById('updateBox').value = '';
    document.getElementById('updateMask').classList.add('show');
  }
  else if(action === 'viewAnalysis'){
    state.tab = 'analysis';
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x.dataset.tab === 'analysis'); });
    refreshAll();
  }
});

  v.link = document.getElementById('f_link').value.trim();
  v.author = document.getElementById('f_author').value.trim() || '未知';
  v.publishTime = document.getElementById('f_publishTime').value.trim() || null;
  v.duration = document.getElementById('f_duration').value.trim() || null;
  v.fans = numOrNull('f_fans'); v.likes = numOrNull('f_likes'); v.comments = numOrNull('f_comments');
  v.favorites = numOrNull('f_favorites'); v.shares = numOrNull('f_shares');
  v.approx = null; /* 人工录入按精确值 */
  v.contentType = document.getElementById('f_contentType').value || null;
  v.topic = document.getElementById('f_topic').value || null;
  v.transcript = document.getElementById('f_transcript').value.trim();
  v.updatedAt = nowStr();
  if(!v.manualOverride && v.status !== 'selected') classifyImported(v);
  document.getElementById('editMask').classList.remove('show');
  var chk = checkHard(v);
  addLog('已编辑「'+v.title.slice(0,20)+'」并重新筛选：' + (chk.verdict==='pass'?'基础条件通过':chk.verdict==='review'?'待复核 '+chk.reviews.length+' 项':'未通过基础条件 '+chk.fails.length+' 项'), 'ok');
  saveData(); refreshAll();
  if(v.transcript && !v.analysis) toast('文案已保存，可在「文案拆解」生成拆解任务');
  else toast('已保存并重新筛选');
});
/* 更新数据保存 */
document.getElementById('updateCancel').addEventListener('click', function(){ document.getElementById('updateMask').classList.remove('show'); });
document.getElementById('updateSave').addEventListener('click', function(){
  var v = findV(updatingId); if(!v) return;
  var txt = document.getElementById('updateBox').value.trim();
  try{
    var raw = JSON.parse(txt);
    if(Array.isArray(raw)) raw = raw[0];
    var nv = rawToVideo(raw);
    ['title','author','publishTime','duration','fans','likes','comments','favorites','shares','contentType','topic'].forEach(function(k){
      if(nv[k] !== null && nv[k] !== '' && nv[k] !== undefined) v[k] = nv[k];
    });
    if(nv.approx) v.approx = nv.approx;
    if(nv.transcript) v.transcript = nv.transcript;
    if(nv.analysis) v.analysis = nv.analysis;
    v.updatedAt = nowStr();
    if(!v.manualOverride && v.status !== 'selected') classifyImported(v);
    document.getElementById('updateMask').classList.remove('show');
    addLog('已更新「'+v.title.slice(0,20)+'」的数据（备注/状态/拆解保留）','ok');
    saveData(); refreshAll();
    toast('数据已更新并重新筛选');
  }catch(err){
    toast('JSON 格式错误：' + err.message, true);
  }
});
/* 人工例外保存 */
document.getElementById('overrideCancel').addEventListener('click', function(){ document.getElementById('overrideMask').classList.remove('show'); });
document.getElementById('overrideSave').addEventListener('click', function(){
  var v = findV(overrideId); if(!v) return;
  var reason = document.getElementById('overrideReason').value.trim();
  if(!reason){ toast('请填写人工例外理由', true); return; }
  v.status = 'selected';
  v.manualOverride = true;
  v.overrideReason = reason;
  v.reason = '人工例外保留：' + reason;
  v.updatedAt = nowStr();
  document.getElementById('overrideMask').classList.remove('show');
  addLog('人工例外保留「'+v.title.slice(0,20)+'」：' + reason,'warn');
  saveData(); refreshAll();
});
/* 通用确认弹窗 */
document.getElementById('modalCancel').addEventListener('click', function(){
  document.getElementById('modalMask').classList.remove('show'); modalCb = null;
});
document.getElementById('modalOk').addEventListener('click', function(){
  document.getElementById('modalMask').classList.remove('show');
  if(modalCb){ var cb = modalCb; modalCb = null; cb(); }
});

/* 备份/表格/清空 */
document.getElementById('btnExportBackup').addEventListener('click', exportBackup);
document.getElementById('btnExportCsv').addEventListener('click', exportCsv);
document.getElementById('btnImportBackup').addEventListener('click', function(){ document.getElementById('importBackupFile').click(); });
document.getElementById('importBackupFile').addEventListener('change', function(e){
  var f = e.target.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      var r = restoreBackup(data);
      if(r.ok){
        addLog('备份恢复完成：更新 '+r.replaced+' 条、新增 '+r.added+' 条（状态/备注/拆解/时间已保留）','ok');
        toast('备份已恢复：更新 '+r.replaced+' 条、新增 '+r.added+' 条');
      }else{
        addLog('备份恢复失败：'+r.msg,'error');
        toast(r.msg, true);
      }
    }catch(err){
      addLog('备份恢复失败：文件不是有效 JSON','error');
      toast('文件不是有效 JSON', true);
    }
  };
  reader.readAsText(f);
  e.target.value = '';
});
document.getElementById('btnClearSample').addEventListener('click', function(){
  confirmModal('清空演示数据', '将删除全部模拟演示记录，真实采集的数据不受影响。确定继续？', function(){
    state.videos = state.videos.filter(function(v){ return !v.isSample; });
    addLog('已清空演示数据','ok'); saveData(); refreshAll();
  });
});
document.getElementById('btnClearAll').addEventListener('click', function(){
  confirmModal('清空全部数据', '将删除全部 '+state.videos.length+' 条记录且不可恢复！建议先导出备份。确定继续？', function(){
    state.videos = []; addLog('已清空全部数据','warn'); saveData(); refreshAll();
  });
});

/* =========================================================
 * 初始化
 * ========================================================= */
document.addEventListener('DOMContentLoaded', function(){
  loadData();
  recheckFreshness();
  addLog('工作台已打开，真实记录 ' + state.videos.filter(function(v){return !v.isSample;}).length + ' 条，演示记录 ' + state.videos.filter(function(v){return v.isSample;}).length + ' 条','info');
  refreshAll();
});
</script>
